spring.application.name=faculty-service

server.port=${PORT:8082}

# MongoDB (Spring Boot 4.x)
spring.mongodb.uri=${FACULTY_MONGODB_URI}
spring.mongodb.database=${FACULTY_DB_NAME:college_faculty}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:https://eureka-server-fbb5.onrender.com/eureka/}

# Register with Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${RENDER_SERVICE_NAME:faculty-service-l8nj}.onrender.com}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# SOAP: MessageDispatcherServlet is registered manually in SoapConfig.java at /ws/*
# Do NOT add spring.webservices.path here — it creates a duplicate servlet registration

# MongoDB index creation
spring.data.mongodb.auto-index-creation=true

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always