spring.application.name=enrollment-service

server.port=${PORT:8084}

# =====================================================
# MariaDB
# =====================================================

spring.datasource.url=${ENROLLMENT_DB_URL}
spring.datasource.username=${ENROLLMENT_DB_USERNAME}
spring.datasource.password=${ENROLLMENT_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# Eureka
# =====================================================

eureka.client.service-url.defaultZone=${EUREKA_URL}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${RENDER_SERVICE_NAME:enrollment-service}.onrender.com}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# SOAP: MessageDispatcherServlet is registered manually in SoapConfig.java at /ws/*
# Do NOT add spring.webservices.path here — it creates a duplicate servlet registration

# =====================================================
# Load Balancer
# =====================================================

spring.cloud.loadbalancer.enabled=true

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always