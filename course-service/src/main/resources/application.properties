spring.application.name=course-service

server.port=${PORT:8083}

# PostgreSQL
spring.datasource.url=${COURSE_DB_URL}
spring.datasource.username=${COURSE_DB_USERNAME}
spring.datasource.password=${COURSE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:${RENDER_SERVICE_NAME:course-service}.onrender.com}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# SOAP: MessageDispatcherServlet is registered manually in SoapConfig.java at /ws/*
# Do NOT add spring.webservices.path here — it creates a duplicate servlet registration

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always