spring.application.name=api-gateway

server.port=${PORT:8080}

# =====================================================
# Eureka
# =====================================================

eureka.client.service-url.defaultZone=${EUREKA_URL}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=false


# =====================================================
# Gateway
# =====================================================

spring.cloud.gateway.server.webflux.enabled=true

# =====================================================
# Circuit Breaker Default Filter
# =====================================================
spring.cloud.gateway.default-filters[0]=CircuitBreaker=myCircuitBreaker

# =====================================================
# CORS
# =====================================================
# CORS is now handled by CorsConfig.java bean


# =====================================================
# STUDENT SERVICE
# =====================================================

spring.cloud.gateway.server.webflux.routes[0].id=student-service

spring.cloud.gateway.server.webflux.routes[0].uri=lb://STUDENT-SERVICE

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/student/**

spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1


# =====================================================
# FACULTY SERVICE
# =====================================================

spring.cloud.gateway.server.webflux.routes[1].id=faculty-service

spring.cloud.gateway.server.webflux.routes[1].uri=lb://FACULTY-SERVICE

spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/faculty/**

spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1


# =====================================================
# COURSE SERVICE
# =====================================================

spring.cloud.gateway.server.webflux.routes[2].id=course-service

spring.cloud.gateway.server.webflux.routes[2].uri=lb://COURSE-SERVICE

spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/course/**

spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# =====================================================
# ENROLLMENT SERVICE
# =====================================================

spring.cloud.gateway.server.webflux.routes[3].id=enrollment-service

spring.cloud.gateway.server.webflux.routes[3].uri=lb://ENROLLMENT-SERVICE

spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/enrollment/**

spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# =====================================================
# EXAM SERVICE
# =====================================================

spring.cloud.gateway.server.webflux.routes[4].id=exam-service

spring.cloud.gateway.server.webflux.routes[4].uri=lb://EXAM-SERVICE

spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/exam/**

spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

# =====================================================
# ATTENDANCE SERVICE
# =====================================================

spring.cloud.gateway.server.webflux.routes[5].id=attendance-service

spring.cloud.gateway.server.webflux.routes[5].uri=lb://ATTENDANCE-SERVICE

spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/attendance/**

spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info,gateway

management.endpoint.health.show-details=always

management.endpoint.gateway.access=read-only
