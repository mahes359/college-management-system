spring.application.name=exam-service

server.port=${PORT:8085}

# =====================================================
# MariaDB
# =====================================================

spring.datasource.url=${EXAM_DB_URL}
spring.datasource.username=${EXAM_DB_USERNAME}
spring.datasource.password=${EXAM_DB_PASSWORD}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# Eureka
# =====================================================

eureka.client.service-url.defaultZone=${EUREKA_URL}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_SERVICE_NAME:exam-service}

# SOAP: MessageDispatcherServlet is registered manually in SoapConfig.java at /ws/*
# Do NOT add spring.webservices.path here — it creates a duplicate servlet registration

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always